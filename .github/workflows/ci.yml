name: FOCUS checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    # Pinned: ubuntu-latest moved to Ubuntu 26.04 (Oct 2026), where
    # Playwright 1.56 cannot install Chromium for the E2E step.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run test:routes
      # Chromium for the end-to-end teacher flow (local stack, scripted model).
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:e2e
