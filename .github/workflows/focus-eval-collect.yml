name: FOCUS eval collect (temporary)

# TEMPORARY — evaluation branch only. After a successful Vercel Preview of a
# commit that contains scripts/eval/PLAN.json, drive the Preview's
# /api/focus-eval endpoint copy by copy (scripts/eval/drive.mjs) and store
# every answer on the focus-eval-results branch, under the commit SHA.

on:
  deployment_status:

permissions:
  contents: write

concurrency:
  group: focus-eval-collect-${{ github.event.deployment.sha }}
  cancel-in-progress: false

jobs:
  collect:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.deployment.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Only evaluation commits
        id: gate
        shell: bash
        run: |
          if [ -f scripts/eval/PLAN.json ]; then echo "on=1" >> "$GITHUB_OUTPUT"; else echo "on=0" >> "$GITHUB_OUTPUT"; fi
      - name: Prepare the results worktree
        if: steps.gate.outputs.on == '1'
        shell: bash
        run: |
          git config --global user.name "focus-eval-bot"
          git config --global user.email "focus-eval-bot@users.noreply.github.com"
          if git ls-remote --exit-code origin refs/heads/focus-eval-results >/dev/null; then
            git fetch -q origin focus-eval-results
            git worktree add -q "$RUNNER_TEMP/res" FETCH_HEAD
            git -C "$RUNNER_TEMP/res" checkout -q -B focus-eval-results
          else
            git worktree add -q --detach "$RUNNER_TEMP/res" HEAD
            git -C "$RUNNER_TEMP/res" checkout -q --orphan focus-eval-results
            git -C "$RUNNER_TEMP/res" rm -rfq .
          fi
      - name: Drive the evaluation
        if: steps.gate.outputs.on == '1'
        shell: bash
        env:
          URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          SHA: ${{ github.event.deployment.sha }}
        run: |
          curl -sS -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$URL/api/health" -o "$RUNNER_TEMP/health.json" || true
          mkdir -p "$RUNNER_TEMP/res/$SHA" && cp "$RUNNER_TEMP/health.json" "$RUNNER_TEMP/res/$SHA/health.json" || true
          node scripts/eval/drive.mjs "$URL" "$RUNNER_TEMP/res" "$SHA"
